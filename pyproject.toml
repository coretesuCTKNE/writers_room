[project]
name = "greenlight"
version = "0.1.0"
description = "AI Screenwriter's Room — coverage, table read, rehearsal"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=2.9,<3",
    "google-adk[extensions]>=1.39.1,<2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pydub>=0.25.0",
    "clickhouse-connect>=0.8.0",
    "websockets>=13.0",
    "python-multipart>=0.0.9",
    "pypdf>=6.16.2",
    "firebase-admin>=6.6.0,<7",
    "google-cloud-storage>=2.18.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greenlight"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
